<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>酒店预订系统 · 手机效果</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #242424; background: #f5f5f5; font: 14px/1.5 system-ui, sans-serif; }
      header { min-height: 64px; padding: 12px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      header strong { font-weight: 600; }
      header span { color: #616161; margin-left: 12px; }
      a { color: #0f6cbd; text-underline-offset: 3px; }
      main { display: grid; place-items: center; padding: 16px; }
      .frame { position: relative; background: white; box-shadow: 0 4px 16px #00000014; outline: 1px solid #d1d1d1; }
      iframe { display: block; width: 390px; height: 844px; border: none; transform-origin: top left; }
    </style>
  </head>
  <body>
    <header><div><strong>顾客端 · 手机效果</strong><span>390 × 844</span></div><a href="/#/explore" target="_blank" rel="noopener">打开原型原页</a></header>
    <main><div class="frame"><iframe title="酒店预订系统顾客端手机窗口" src="/#/explore"></iframe></div></main>
    <script>
      const frame = document.querySelector('.frame');
      const preview = document.querySelector('iframe');
      function fit() {
        const scale = Math.max(0.1, Math.min(1, (innerWidth - 32) / 390, (innerHeight - document.querySelector('header').offsetHeight - 32) / 844));
        frame.style.width = `${390 * scale}px`;
        frame.style.height = `${844 * scale}px`;
        preview.style.transform = `scale(${scale})`;
      }
      addEventListener('resize', fit);
      fit();
    </script>
  </body>
</html>
